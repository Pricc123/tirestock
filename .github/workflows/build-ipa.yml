name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project TireStock.xcodeproj \
            -scheme TireStock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -60

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/TireStock.app" Payload/
          zip -qry TireStock-unsigned.ipa Payload
          ls -lh TireStock-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/TireStock.app/Info.plist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TireStock-unsigned-ipa
          path: TireStock-unsigned.ipa
